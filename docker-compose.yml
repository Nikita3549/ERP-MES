services:
  api:
    build:
      context: .
    container_name: erp-mes
    profiles:
      - api
    restart: always
    ports:
      - ${HTTP_PORT:-8080}:${HTTP_PORT:-8080}
    environment:
      DB_HOST: db
    env_file:
      - path: .env
        required: false
    stop_grace_period: 25s
    depends_on:
      migrate:
        condition: service_completed_successfully
  db:
    image: postgres:17-alpine
    container_name: erp-mes-db
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_DB: ${DB_NAME:-erp-mes}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h localhost -U ${DB_USER:-postgres} -d ${DB_NAME:-erp-mes}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-erp-mes}?sslmode=disable
      - up
    container_name: erp-mes-migrate
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
